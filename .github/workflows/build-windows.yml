name: Mac・Windows版を同時作成

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      - name: Windowsインストーラーを作成
        run: npm run build && npx electron-builder --config electron-builder.test.yml --win --x64
      - uses: actions/upload-artifact@v4
        with:
          name: LED-STAGE-IMAGER-TEST-Windows-v1.3.11-NDI-Runtime-Required
          path: dist/LED-STAGE-IMAGER-TEST-*-setup.exe
          if-no-files-found: error
          retention-days: 30
  build-mac:
    name: Mac Apple Silicon
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      - name: Mac版を作成
        run: npm run build && npx electron-builder --config electron-builder.test.yml --mac --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: LED-STAGE-IMAGER-TEST-Mac-arm64-v1.3.11
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30
